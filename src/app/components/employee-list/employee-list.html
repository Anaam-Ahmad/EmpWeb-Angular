<div class="card shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Employee List</h5>
    <button class="btn btn-success btn-sm" routerLink="/employee/new">+ Add Employee</button>
  </div>

  <div class="card-body p-0">
    <table class="table table-striped table-hover align-middle mb-0">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Address</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (emp of employees(); track emp.id) {
          <tr>
            <td>{{ emp.id }}</td>
            <td>{{ emp.name }}</td>
            <td>{{ emp.email }}</td>
            <td>{{ emp.phone }}</td>
            <td>{{ emp.address }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-info me-1" [routerLink]="['/employee', emp.id]">View</button>
              <button class="btn btn-sm btn-outline-danger">Delete</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="text-center text-muted py-4">No employees found</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
